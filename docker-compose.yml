version: '3.8'

services:
  teleprompter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teleprompter-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TMA_URL=${TMA_URL}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATA_DIR=/app/data
    volumes:
      - teleprompter_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  teleprompter_data:
    name: teleprompter_data
